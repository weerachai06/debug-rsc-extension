name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main queue instead of being cancelled, so a merge is not skipped by the next one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flight

      # Same version as local development; the repo now lives at wasm-bindgen/wasm-pack.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: npm ci

      - run: bash scripts/next-version.test.sh

      # Runs the Rust tests, which regenerate src/bindings from the Rust types,
      # then fails if the committed bindings differ or contain bigint.
      - run: npm run check:bindings

      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npx wxt build

      # A build anyone can load as an unpacked extension, see docs/dev-extension.md.
      - uses: actions/upload-artifact@v7
        with:
          name: rsc-debugger-chrome-mv3
          path: .output/chrome-mv3
          if-no-files-found: error

  # Every merge to main publishes the build CI just tested as a GitHub release.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: rsc-debugger-chrome-mv3
          path: chrome-mv3

      # The version is the next patch after the newest vX.Y.Z tag (or package.json, if that is ahead).
      # It is written into the built manifest only; package.json is not changed.
      - name: Publish release
        run: |
          base=$(jq -r .version chrome-mv3/manifest.json)
          version=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | sub("refs/tags/"; "")' | scripts/next-version.sh "$base")
          jq --arg v "$version" '.version = $v' chrome-mv3/manifest.json > manifest.json.new
          mv manifest.json.new chrome-mv3/manifest.json
          (cd chrome-mv3 && zip -qr "../rsc-debugger-$version-chrome.zip" .)
          gh release create "v$version" "rsc-debugger-$version-chrome.zip" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes "Unpacked Chrome extension. Unzip it, then open chrome://extensions, turn on Developer mode and choose Load unpacked. See docs/dev-extension.md for a smoke test." \
            --generate-notes
